<!DOCTYPE html>
<html>
<head>

<title>Loan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{background:#f5f7fa;}
.navbar{background:#1f3b5b;}
.card{border:none;border-radius:15px;}
.btn-bank{background:#1f3b5b;color:white;}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">🏦 ABC Bank</a>

<a href="/customer_dashboard" class="btn btn-light btn-sm">

Dashboard

</a>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h3>Apply Loan</h3>

<form method="POST">

<label>Loan Type</label>

<select name="loan_type" class="form-select mb-3">

<option>Home Loan</option>

<option>Education Loan</option>

<option>Personal Loan</option>

<option>Vehicle Loan</option>

</select>

<label>Amount</label>

<input type="number" name="amount" class="form-control mb-3" required>

<label>Tenure (Years)</label>

<input type="number" name="tenure" class="form-control mb-3" required>

<label>Monthly Income</label>

<input type="number" name="income" class="form-control mb-3" required>

<label>Purpose</label>

<textarea name="purpose" class="form-control mb-3"></textarea>

<button class="btn btn-bank w-100">

Apply Loan

</button>

</form>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-header">

Loan History

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>Type</th>
<th>Amount</th>
<th>Status</th>

</tr>

{% for l in loans %}

<tr>

<td>{{l.loan_type}}</td>

<td>₹ {{l.amount}}</td>

<td>{{l.status}}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

</body>

</html>
