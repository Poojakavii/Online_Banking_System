<!DOCTYPE html>
<html>

<head>

<title>Fixed Deposit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{background:#f5f7fa;}
.navbar{background:#1f3b5b;}
.card{border:none;border-radius:15px;}
.btn-bank{background:#1f3b5b;color:white;}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">

🏦 ABC Bank

</a>

<a href="/customer_dashboard" class="btn btn-light btn-sm">

Dashboard

</a>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h3>Create Fixed Deposit</h3>

<form method="POST">

<label>Amount</label>

<input type="number" class="form-control mb-3" name="amount" required>

<label>Tenure (Years)</label>

<input type="number" class="form-control mb-3" name="tenure" required>

<button class="btn btn-bank w-100">

Create FD

</button>

</form>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-header">

Your Fixed Deposits

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>Amount</th>
<th>Interest</th>
<th>Tenure</th>

</tr>

{% for fd in fds %}

<tr>

<td>₹ {{fd.amount}}</td>

<td>{{fd.interest_rate}} %</td>

<td>{{fd.tenure}} Years</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

</body>

</html>
