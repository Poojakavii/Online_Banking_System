<!DOCTYPE html>
<html>
<head>

<title>Approve Loans</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Loan Requests</h2>

<table class="table table-bordered bg-white">

<tr>

<th>ID</th>
<th>Customer</th>
<th>Loan</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>

</tr>

{% for l in loans %}

<tr>

<td>{{l.loan_id}}</td>

<td>{{l.name}}</td>

<td>{{l.loan_type}}</td>

<td>₹ {{l.amount}}</td>

<td>{{l.status}}</td>

<td>

{% if l.status!="Approved" %}

<a href="/approve_loan/{{l.loan_id}}" class="btn btn-success btn-sm">

Approve

</a>

{% else %}

<span class="badge bg-success">

Approved

</span>

{% endif %}

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
