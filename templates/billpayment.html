<!DOCTYPE html>
<html>
<head>

<title>Bill Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{background:#f5f7fa;}
.navbar{background:#1f3b5b;}
.card{border:none;border-radius:15px;}
.btn-bank{background:#1f3b5b;color:white;}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">🏦 ABC Bank</a>

<a href="/customer_dashboard" class="btn btn-light btn-sm">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h3>Bill Payment</h3>

<form method="POST">

<label>Bill Type</label>

<select name="bill_type" class="form-select mb-3">

<option>Electricity</option>
<option>Water</option>
<option>Gas</option>
<option>Internet</option>

</select>

<label>Consumer Number</label>

<input type="text" class="form-control mb-3" name="consumer_number" required>

<label>Provider</label>

<input type="text" class="form-control mb-3" name="provider" required>

<label>Amount</label>

<input type="number" class="form-control mb-3" name="amount" required>

<button class="btn btn-bank w-100">

Pay Bill

</button>

</form>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-header">

Bill History

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>Date</th>
<th>Bill</th>
<th>Provider</th>
<th>Amount</th>

</tr>

{% for b in bills %}

<tr>

<td>{{b.payment_date}}</td>

<td>{{b.bill_type}}</td>

<td>{{b.provider}}</td>

<td>₹ {{b.amount}}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

</body>

</html>
