<!DOCTYPE html>
<html>
<head>

<title>Approve Transfers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Approve Fund Transfers</h2>

<table class="table table-bordered bg-white">

<tr>

<th>ID</th>
<th>Customer</th>
<th>Beneficiary</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>

</tr>

{% for t in transfers %}

<tr>

<td>{{t.transfer_id}}</td>

<td>{{t.name}}</td>

<td>{{t.beneficiary_name}}</td>

<td>₹ {{t.amount}}</td>

<td>{{t.status}}</td>

<td>

{% if t.status!="Approved" %}

<a href="/approve_transfer/{{t.transfer_id}}" class="btn btn-success btn-sm">

Approve

</a>

{% else %}

<span class="badge bg-success">

Approved

</span>

{% endif %}

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
