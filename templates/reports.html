<!DOCTYPE html>
<html>
<head>

<title>Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>System Reports</h2>

<table class="table table-bordered bg-white">

<tr>

<th>Total Customers</th>

<td>{{report.customers}}</td>

</tr>

<tr>

<th>Total Loans</th>

<td>{{report.loans}}</td>

</tr>

<tr>

<th>Total Transfers</th>

<td>{{report.transfers}}</td>

</tr>

<tr>

<th>Total Fixed Deposits</th>

<td>{{report.fds}}</td>

</tr>

<tr>

<th>Total Bill Payments</th>

<td>{{report.bills}}</td>

</tr>

<tr>

<th>Total Bank Balance</th>

<td>₹ {{report.balance}}</td>

</tr>

</table>

<a href="/admin_dashboard" class="btn btn-primary">

Back to Dashboard

</a>

</div>

</body>

</html>
