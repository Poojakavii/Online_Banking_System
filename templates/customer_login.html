<!DOCTYPE html>
<html>
<head>

<title>Customer Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef2f7;
}

.card{
max-width:450px;
margin:auto;
margin-top:80px;
border:none;
border-radius:15px;
}

.btn-bank{
background:#1f3b5b;
color:white;
}

</style>

</head>

<body>

<div class="card shadow">

<div class="card-body">

<h3 class="text-center mb-4">

Customer Login

</h3>

<form method="POST">

<label>Email</label>

<input type="email"
name="email"
class="form-control mb-3"
required>

<label>Password</label>

<input type="password"
name="password"
class="form-control mb-4"
required>

<button class="btn btn-bank w-100">

Login

</button>

</form>

<hr>

<div class="text-center">

<a href="/register">

Create New Account

</a>

</div>

</div>

</div>

</body>

</html>
