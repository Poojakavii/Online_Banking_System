<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beneficiary</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f7fa;
}

.navbar{
background:#1f3b5b;
}

.card{
border:none;
border-radius:15px;
}

.btn-bank{
background:#1f3b5b;
color:white;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark">
<div class="container">
<a class="navbar-brand fw-bold">🏦 ABC Bank</a>
<a href="/customer_dashboard" class="btn btn-light btn-sm">Dashboard</a>
</div>
</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h3 class="mb-4">Add Beneficiary</h3>

<form action="/beneficiary" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Name</label>
<input type="text" name="beneficiary_name" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Receiver Account Number</label>
<input type="text" name="receiver_account" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Bank Name</label>
<input type="text" name="bank_name" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>IFSC</label>
<input type="text" name="ifsc" class="form-control" required>
</div>

</div>

<button class="btn btn-bank w-100">
Save Beneficiary
</button>

</form>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-header">

<h5>Saved Beneficiaries</h5>

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>
<th>Name</th>
<th>Account</th>
<th>Bank</th>
<th>IFSC</th>
</tr>

{% for b in beneficiaries %}

<tr>

<td>{{ b.name }}</td>

<td>{{ b.account_number }}</td>

<td>{{ b.bank_name }}</td>

<td>{{ b.ifsc }}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

</body>
</html>
