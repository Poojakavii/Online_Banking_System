<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ABC Bank</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            color: #172033;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar {
            height: 72px;
            background: linear-gradient(135deg, #0b1f3a, #123e70);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            color: white;
            box-shadow: 0 5px 20px rgba(11, 31, 58, 0.15);
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .home-btn {
            text-decoration: none;
            color: white;
            padding: 10px 17px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s;
        }

        .home-btn:hover {
            background: white;
            color: #123e70;
        }

        /* PAGE */
        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
        }

        /* LOGIN CARD */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 22px;
            padding: 38px;
            border: 1px solid #e5ebf3;
            box-shadow: 0 18px 45px rgba(15, 35, 65, 0.10);
        }

        .icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 20px;
            border-radius: 17px;
            background: #eaf2ff;
            color: #1761a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #102a4c;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .heading p {
            color: #7a8799;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ERROR */
        .error {
            background: #fff0f0;
            border: 1px solid #ffd0d0;
            color: #c0392b;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #344054;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.65;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d9e0e9;
            border-radius: 11px;
            padding: 0 14px 0 42px;
            font-family: inherit;
            font-size: 14px;
            color: #172033;
            outline: none;
            background: #fbfcfe;
            transition: 0.2s;
        }

        input:focus {
            border-color: #1761a8;
            background: white;
            box-shadow: 0 0 0 3px rgba(23, 97, 168, 0.10);
        }

        /* BUTTON */
        .login-btn {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #123e70, #1761a8);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(18, 62, 112, 0.22);
        }

        .security-note {
            margin-top: 23px;
            padding-top: 18px;
            border-top: 1px solid #edf1f6;
            text-align: center;
            color: #8995a6;
            font-size: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            .navbar {
                padding: 0 5%;
            }

            .login-card {
                padding: 28px 22px;
            }

            .heading h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="brand">
        ABC Bank
    </div>

    <a href="/" class="home-btn">
        ← Home
    </a>

</nav>


<!-- LOGIN -->
<main class="page">

    <div class="login-card">

        <div class="icon">
            🔐
        </div>

        <div class="heading">

            <h1>Admin Login</h1>

            <p>
                Sign in to access the ABC Bank administration panel.
            </p>

        </div>


        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            <!-- ADMIN ID -->
            <div class="form-group">

                <label for="admin_id">
                    Admin ID
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="admin_id"
                        name="admin_id"
                        placeholder="Enter admin ID"
                        required
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                        autocomplete="new-password"
                    >

                </div>

            </div>


            <button type="submit" class="login-btn">
                Sign In to Admin Panel
            </button>

        </form>


        <div class="security-note">
            🔒 Authorized administration access only
        </div>

    </div>

</main>

</body>
</html>
