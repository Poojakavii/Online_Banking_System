<!DOCTYPE html>
<html>
<head>

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef2f7;
}

.card{
max-width:450px;
margin:80px auto;
border:none;
border-radius:15px;
}

.btn-bank{
background:#1f3b5b;
color:white;
}

</style>

</head>

<body>

<div class="card shadow">

<div class="card-body">

<h3 class="text-center mb-4">

Admin Login

</h3>

<form method="POST">

<label>Admin ID</label>

<input
type="text"
name="admin_id"
class="form-control mb-3"
required>

<label>Password</label>

<input
type="password"
name="password"
class="form-control mb-4"
required>

<button class="btn btn-bank w-100">

Login

</button>

</form>

{% if error %}

<div class="alert alert-danger mt-3">

{{ error }}

</div>

{% endif %}

</div>

</div>

</body>

</html>
