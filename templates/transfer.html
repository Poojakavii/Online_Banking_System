<!DOCTYPE html>
<html>
<head>

<title>Fund Transfer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fa;
}

.navbar{
background:#1f3b5b;
}

.card{
border-radius:15px;
border:none;
}

.btn-bank{
background:#1f3b5b;
color:white;
}

</style>

</head>


<body>


<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold">
🏦 ABC Bank
</a>

<a href="/customer_dashboard" class="btn btn-light btn-sm">
Dashboard
</a>

</div>

</nav>



<div class="container mt-5">


<h2>
Fund Transfer
</h2>


<div class="card shadow mt-4">

<div class="card-body">


<form method="POST" action="/transfer">


<label>
Select Beneficiary
</label>


<select name="beneficiary" class="form-select mb-3" required>


<option value="">
Select Beneficiary
</option>


{% for b in beneficiaries %}

<option value="{{b.beneficiary_id}}">

{{b.name}} -
{{b.account_number}}

</option>


{% endfor %}


</select>



<label>
Transfer Type
</label>

<select name="transfer_type" class="form-select mb-3">


<option>
NEFT
</option>

<option>
RTGS
</option>

<option>
IMPS
</option>

<option>
UPI
</option>


</select>



<label>
Amount
</label>

<input 
type="number"
name="amount"
class="form-control mb-3"
required>



<label>
Remarks
</label>


<textarea
name="remarks"
class="form-control mb-3">
</textarea>



<button class="btn btn-bank w-100">

Transfer Money

</button>


</form>


</div>

</div>





<div class="card shadow mt-4">


<div class="card-header">

<h5>
Transfer History
</h5>

</div>



<div class="card-body">


<table class="table table-bordered">


<tr>

<th>Date</th>
<th>Beneficiary</th>
<th>Amount</th>
<th>Status</th>

</tr>



{% for t in transfers %}


<tr>

<td>
{{t.transfer_date}}
</td>


<td>
{{t.beneficiary_name}}
</td>


<td>
₹ {{t.amount}}
</td>


<td>

<span class="badge bg-success">

{{t.status}}

</span>

</td>


</tr>


{% endfor %}



</table>



</div>

</div>


</div>


</body>

</html>
