<!DOCTYPE html>
<html>
<head>

<title>My Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{background:#f5f7fa;}
.navbar{background:#1f3b5b;}
.card{border:none;border-radius:15px;}
.btn-bank{background:#1f3b5b;color:white;}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">🏦 ABC Bank</a>

<a href="/customer_dashboard" class="btn btn-light btn-sm">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h3>My Account</h3>

<table class="table">

<tr><th>Name</th><td>{{customer.name}}</td></tr>

<tr><th>Account Number</th><td>{{customer.account_number}}</td></tr>

<tr><th>Bank</th><td>{{customer.bank_name}}</td></tr>

<tr><th>IFSC</th><td>{{customer.ifsc}}</td></tr>

<tr><th>Account Type</th><td>{{customer.account_type}}</td></tr>

<tr><th>Balance</th><td>₹ {{customer.balance}}</td></tr>

</table>

</div>

</div>

</div>

</body>
</html>
