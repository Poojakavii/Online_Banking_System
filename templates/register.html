<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef2f7;
}

.card{
border:none;
border-radius:15px;
}

.btn-bank{
background:#1f3b5b;
color:white;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">

Customer Registration

</h2>
{% if error %}

<div class="alert alert-danger">

{{error}}

</div>

{% endif %}

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<input class="form-control" name="name" placeholder="Full Name" required>
</div>

<div class="col-md-6 mb-3">
<input class="form-control" type="email" name="email" placeholder="Email" required>
</div>

<div class="col-md-6 mb-3">
<input class="form-control" name="phone" placeholder="Phone" required>
</div>

<div class="col-md-6 mb-3">
<input class="form-control" type="password" name="password" placeholder="Password" required>
</div>

<div class="col-md-12 mb-3">
<textarea class="form-control" name="address" placeholder="Address"></textarea>
</div>

<div class="col-md-6 mb-3">
<input type="date" class="form-control" name="dob">
</div>

<div class="col-md-6 mb-3">
<select class="form-select" name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="col-md-6 mb-3">
<select class="form-select" name="account_type">
<option>Savings</option>
<option>Current</option>
</select>
</div>

<div class="col-md-6 mb-3">
<input class="form-control" name="bank_name" value="ABC Bank">
</div>

<div class="col-md-6 mb-3">
<input class="form-control" name="account_number" placeholder="Account Number" required>
</div>

<div class="col-md-6 mb-3">
<input class="form-control" name="ifsc" placeholder="IFSC Code" required>
</div>

<div class="col-md-6 mb-3">
<input class="form-control" type="number" name="balance" value="0">
</div>

</div>

<button class="btn btn-bank w-100">

Register

</button>

</form>

</div>

</div>

</div>

</body>

</html>
